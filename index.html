<!DOCTYPE html>
<html>
<head>

    <title>Photon</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
        }

        header {
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
        }

        .logo {
            font-size: 32px;
        }

        nav a {
            text-decoration: none;
            color: black;
            margin: 15px;
            font-size: 13px;
        }

        .gallery-menu {
            display: inline-block;
            position: relative;
        }

        .dropdown {
            display: none;
            position: absolute;
            background: white;
            width: 200px;
            padding: 15px;
            top: 25px;
        }

        .dropdown a {
            display: block;
            margin: 15px 5px;
            color: #777;
        }

        .gallery-menu:hover .dropdown {
            display: block;
        }

        .social i {
            margin: 10px;
        }

        .photos {
            display: flex;
            gap: 20px;
            padding: 0 5px;
        }

        .photo {
            width: 33.33%;
            position: relative;
        }

        .photo img {
            width: 100%;
            height: 345px;
            object-fit: cover;
        }

        .text {
            position: absolute;
            top: 40%;
            width: 100%;
            text-align: center;
            color: white;
        }

        .text h2 {
            margin-bottom: 20px;
        }

        .text a {
            color: white;
            border: 2px solid white;
            padding: 10px 20px;
            text-decoration: none;
        }

    </style>

</head>

<body>

<header>

    <h1 class="logo">Photon</h1>

    <nav>

        <a href="#">HOME</a>

        <div class="gallery-menu">

            <a href="#">GALLERY⌄</a>

            <div class="dropdown">

                <a href="#">Nature</a>
                <a href="#">Portrait</a>
                <a href="#">People</a>
                <a href="#">Architecture</a>
                <a href="#">Animals</a>
                <a href="#">Sports</a>
                <a href="#">Travel</a>
                <a href="#">Sub Menu</a>

            </div>

        </div>

        <a href="#">SERVICES</a>
        <a href="#">BLOG</a>
        <a href="#">ABOUT</a>
        <a href="#">REVIEWS</a>
        <a href="#">CONTACT</a>

    </nav>

    <div class="social">

        <i class="fa-brands fa-facebook-f"></i>
        <i class="fa-brands fa-twitter"></i>
        <i class="fa-brands fa-instagram"></i>
        <i class="fa-brands fa-youtube"></i>

    </div>

</header>


<div class="photos">

    <div class="photo">

        <img src="images/img_1.png">

        <div class="text">
            <h2>Nature</h2>
            <a href="#">MORE PHOTOS</a>
        </div>

    </div>


    <div class="photo">

        <img src="images/img_2.png">

        <div class="text">
            <h2>Portrait</h2>
            <a href="#">MORE PHOTOS</a>
        </div>

    </div>


    <div class="photo">

        <img src="images/img_3.png">

        <div class="text">
            <h2>People</h2>
            <a href="#">MORE PHOTOS</a>
        </div>

    </div>

</div>

</body>
</html>
